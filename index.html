<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Our Website is Under Construction</title>
    <style>
        /* 1. Global Reset & Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            /* Optimized font stack for English */
            font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            color: #ffffff;
            line-height: 1.6;
        }

        /* 2. Background & Layout */
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* Aesthetic gradient background */
            background: linear-gradient(135deg, #1d2b4a 0%, #0c101a 100%);
            overflow: hidden;
        }

        /* 3. Content Card (Glassmorphism Effect) */
        .content-box {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 50px 40px;
            
            /* Glass effect */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            
            /* Border & Shadow */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            
            /* Fade-in Animation */
            transform: translateY(20px);
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 4. Text Content */
        .logo-placeholder {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            /* You can replace this with your <img> logo */
        }

        h1 {
            font-size: 3.2rem; /* Slightly adjusted for "Coming Soon" */
            margin-bottom: 15px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        /* 5. Countdown Timer */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            min-width: 80px;
        }

        .time-box span {
            display: block;
        }

        .time-box .number {
            font-size: 2rem;
            font-weight: 600;
        }

        .time-box .label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        /* 6. Contact Info */
        .contact p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .contact a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px dashed #ffffff;
            transition: color 0.3s ease, border-bottom-color 0.3s ease;
        }

        .contact a:hover {
            color: #a0c4ff; /* Highlight color on hover */
            border-bottom-color: #a0c4ff;
        }

        /* 7. Responsive Design */
        @media (max-width: 640px) {
            .content-box {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2.5rem;
            }

            #countdown {
                gap: 10px;
            }

            .time-box {
                min-width: 65px;
                padding: 10px;
            }

            .time-box .number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content-box">
            
            <div class="logo-placeholder">
                YOUR LOGO
            </div>

            <h1>Coming Soon</h1>
            <p class="subtitle">Our new website is under construction. We'll be here soon!</p>

            <div id="countdown">
                <div class="time-box">
                    <span class="number" id="days">00</span>
                    <span class="label">Days</span>
                </div>
                <div class="time-box">
                    <span class="number" id="hours">00</span>
                    <span class="label">Hours</span>
                </div>
                <div class="time-box">
                    <span class="number" id="minutes">00</span>
                    <span class="label">Minutes</span>
                </div>
                <div class="time-box">
                    <span class="number" id="seconds">00</span>
                    <span class="label">Seconds</span>
                </div>
            </div>

            <div class="contact">
                <p>Any questions? <a href="mailto:info@yourcompany.com">Contact Us</a></p>
            </div>

        </div>
    </div>

    <script>
        // --- Countdown Script ---

        // 1. Set your target launch date and time
        // Format: "Month Day, Year HH:MM:SS" (e.g., "Jan 1, 2026 00:00:00")
        //
        // !! IMPORTANT !!: Replace this with your own target date
        const targetDate = new Date("Jan 1, 2026 00:00:00").getTime();

        // 2. Update the countdown every second
        const countdownFunction = setInterval(() => {
            // Get today's date and time
            const now = new Date().getTime();
            
            // Find the distance between now and the target date
            const distance = targetDate - now;
            
            // Time calculations for days, hours, minutes, and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // Helper function to format numbers (adds a leading 0 if < 10)
            const format = (num) => (num < 10 ? '0' + num : num);

            // Output the result in the corresponding elements
            document.getElementById('days').innerText = format(days);
            document.getElementById('hours').innerText = format(hours);
            document.getElementById('minutes').innerText = format(minutes);
            document.getElementById('seconds').innerText = format(seconds);
            
            // If the countdown is finished
            if (distance < 0) {
                clearInterval(countdownFunction);
                document.getElementById('countdown').innerHTML = "<p style='font-size: 1.5rem; width: 100%;'>We Are Live!</p>";
                // Optionally, redirect to the new website
                // window.location.href = "https://your-new-website.com";
            }
        }, 1000); // 1000ms = 1 second
    </script>

</body>
</html>
